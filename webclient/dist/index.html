<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WindTerm AI - Web Terminal Client</title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             connect-src 'self' ws: wss: http://localhost:* https://*.monkeycode-ai.online:*;
             style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
             script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net;
             font-src 'self' https://cdn.jsdelivr.net;
             img-src 'self' data: https: blob:;
             media-src 'none';
             frame-src 'none';
             object-src 'none';
             base-uri 'self';
             form-action 'self';">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="manifest" href="/manifest.webmanifest">
  <script type="module" crossorigin src="/assets/main-D7bGCIkz.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-DCloS6wW.css">
</head>
<body>
  <div id="app">
    <!-- 顶栏 -->
    <header id="topbar">
      <div class="brand">
        <i class="fa-solid fa-terminal"></i>
        <span>WindTerm AI</span>
      </div>
      <div class="connection-bar">
        <input type="text" id="hostInput" placeholder="主机" value="localhost" title="主机地址">
        <input type="number" id="portInput" placeholder="端口" value="22" class="desktop-only" title="端口">
        <input type="text" id="userInput" placeholder="用户" class="desktop-only" title="用户名">
        <input type="text" id="tokenInput" placeholder="令牌" style="width:110px" title="认证令牌">
        <button id="connectBtn" class="btn-primary"><i class="fa-solid fa-plug"></i> <span id="connectBtnText" class="desktop-only">连接</span></button>
        <button id="saveTemplateBtn" class="btn-sm desktop-only" title="保存为配置模板"><i class="fa-solid fa-bookmark"></i></button>
      </div>
      <div class="actions">
        <button id="toggleSessions" class="btn-icon" title="会话管理"><i class="fa-solid fa-server"></i></button>
        <button id="toggleSnippets" class="btn-icon" title="碎片笔记"><i class="fa-solid fa-note-sticky"></i></button>
        <button id="toggleChat" class="btn-icon" title="会话聊天" style="display:none"><i class="fa-solid fa-comments"></i></button>
        <button id="toggleTheme" class="btn-icon" title="切换主题"><i class="fa-solid fa-moon"></i></button>
        <button id="toggleFullscreen" class="btn-icon" title="全屏"><i class="fa-solid fa-expand"></i></button>
        <button id="toggleLang" class="btn-icon" title="Switch Language"><i class="fa-solid fa-language"></i></button>
        <button id="newTabBtn" class="btn-icon" title="新建标签"><i class="fa-solid fa-plus"></i></button>
      </div>
    </header>

    <!-- 主内容区 -->
    <div id="mainArea">
      <!-- 左侧会话管理面板 -->
      <div id="sessionSidebar" class="hidden">
        <div id="sessionSidebarHeader">
          <h3><i class="fa-solid fa-server"></i> 会话管理</h3>
          <button id="closeSessionSidebarBtn" class="btn-icon" title="关闭面板"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="sessionSidebarContent">
          <div class="sidebar-section">
            <div class="sidebar-section-title">活跃会话</div>
            <div id="activeSessionList">
              <div class="sidebar-empty">无活跃会话</div>
            </div>
          </div>
          <div class="sidebar-section">
            <div class="sidebar-section-title">连接历史</div>
            <div id="historySessionList">
              <div class="sidebar-empty">无连接历史</div>
            </div>
          </div>
          <div class="sidebar-section">
            <div class="sidebar-section-title">配置模板</div>
            <div id="templateSessionList">
              <div class="sidebar-empty">无配置模板</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 左侧终端面板 -->
      <div id="terminalPanel">
        <div id="tabBar">
          <div id="tabList"></div>
          <div id="tabSpacer"></div>
        </div>
        <div id="terminalContainer">
          <div id="terminalHint">
            <div class="hint-icon"><i class="fa-solid fa-terminal fa-3x"></i></div>
            <h2>未连接</h2>
            <p>在顶部输入主机地址、端口和认证令牌，然后点击连接</p>
            <div class="hint-connection">
              <div class="hint-item"><i class="fa-solid fa-globe"></i> 输入目标主机</div>
              <div class="hint-item"><i class="fa-solid fa-key"></i> 输入认证令牌</div>
              <div class="hint-item"><i class="fa-solid fa-plug"></i> 点击连接建立会话</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 右侧碎片笔记面板 -->
      <div id="snippetPanel" class="hidden">
        <div id="snippetHeader">
          <h3><i class="fa-solid fa-note-sticky"></i> 碎片笔记</h3>
          <div>
            <button id="newSnippetBtn" class="btn-sm"><i class="fa-solid fa-plus"></i> <span id="newSnippetBtnText">新建</span></button>
            <button id="closeSnippetsBtn" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>
        <div id="snippetList"></div>
        <div id="snippetEditor">
          <input type="text" id="snippetTitle" placeholder="笔记标题...">
          <div id="snippetToolbar">
            <button class="btn-toolbar" data-cmd="bold" title="粗体"><i class="fa-solid fa-bold"></i></button>
            <button class="btn-toolbar" data-cmd="italic" title="斜体"><i class="fa-solid fa-italic"></i></button>
            <button class="btn-toolbar" data-cmd="underline" title="下划线"><i class="fa-solid fa-underline"></i></button>
            <button class="btn-toolbar" data-cmd="strikeThrough" title="删除线"><i class="fa-solid fa-strikethrough"></i></button>
            <span class="toolbar-sep"></span>
            <button class="btn-toolbar" data-cmd="insertUnorderedList" title="无序列表"><i class="fa-solid fa-list-ul"></i></button>
            <button class="btn-toolbar" data-cmd="insertOrderedList" title="有序列表"><i class="fa-solid fa-list-ol"></i></button>
            <button class="btn-toolbar" data-cmd="formatBlock" data-arg="pre" title="代码块"><i class="fa-solid fa-code"></i></button>
            <button class="btn-toolbar" data-cmd="createLink" title="链接"><i class="fa-solid fa-link"></i></button>
            <span class="toolbar-sep"></span>
            <button class="btn-toolbar" data-cmd="foreColor" data-arg="#e06c75" title="红色"><i class="fa-solid fa-palette" style="color:#e06c75"></i></button>
            <button class="btn-toolbar" data-cmd="foreColor" data-arg="#98c379" title="绿色"><i class="fa-solid fa-palette" style="color:#98c379"></i></button>
            <button class="btn-toolbar" data-cmd="foreColor" data-arg="#61afef" title="蓝色"><i class="fa-solid fa-palette" style="color:#61afef"></i></button>
            <button class="btn-toolbar" data-cmd="removeFormat" title="清除格式"><i class="fa-solid fa-eraser"></i></button>
          </div>
          <div id="snippetContent" contenteditable="true" placeholder="在此输入笔记内容..."></div>
          <div id="snippetActions">
            <button id="saveSnippetBtn" class="btn-primary"><i class="fa-solid fa-floppy-disk"></i> 保存</button>
            <button id="deleteSnippetBtn" class="btn-danger"><i class="fa-solid fa-trash"></i> 删除</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 状态栏 -->
    <footer id="statusbar">
      <div class="status-left">
        <span id="statusIndicator" class="status-dot disconnected"></span>
        <span id="statusText">未连接</span>
      </div>
      <div class="status-right">
        <span id="tabCount">0 个标签</span>
        <span id="snippetCount">0 条笔记</span>
      </div>
    </footer>
  </div>

  <!-- 右键菜单 -->
  <div id="contextMenu" class="hidden">
    <div class="menu-item" data-action="copy"><i class="fa-solid fa-copy"></i> 复制</div>
    <div class="menu-item" data-action="paste"><i class="fa-solid fa-paste"></i> 粘贴</div>
    <div class="menu-sep"></div>
    <div class="menu-item" data-action="clear"><i class="fa-solid fa-eraser"></i> 清除终端</div>
    <div class="menu-item" data-action="saveSnippet"><i class="fa-solid fa-note-sticky"></i> 保存为笔记</div>
    <div class="menu-sep"></div>
    <div class="menu-item" data-action="export"><i class="fa-solid fa-file-export"></i> 导出终端内容</div>
  </div>

  <!-- P4-2: 标签右键菜单 -->
  <div id="tabContextMenu" class="hidden">
    <div class="menu-item" data-action="close"><i class="fa-solid fa-xmark"></i> 关闭标签</div>
    <div class="menu-item" data-action="closeOthers"><i class="fa-solid fa-window-restore"></i> 关闭其他</div>
    <div class="menu-item" data-action="closeAll"><i class="fa-solid fa-trash"></i> 关闭全部</div>
    <div class="menu-sep"></div>
    <div class="menu-item" data-action="duplicate"><i class="fa-solid fa-copy"></i> 复制标签</div>
    <div class="menu-item" data-action="rename"><i class="fa-solid fa-pen"></i> 重命名</div>
  </div>

  <!-- P3-1: 终端搜索栏 -->
  <div id="searchBar" class="hidden">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="搜索...">
      <span id="searchCount" class="search-count"></span>
      <button id="searchPrevBtn" class="btn-icon" title="上一个"><i class="fa-solid fa-chevron-up"></i></button>
      <button id="searchNextBtn" class="btn-icon" title="下一个"><i class="fa-solid fa-chevron-down"></i></button>
      <button id="searchCloseBtn" class="btn-icon" title="关闭"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>

  <!-- P3-3: 快捷键帮助对话框 -->
  <div id="shortcutsDialog" class="hidden">
    <div class="dialog-overlay"></div>
    <div class="dialog-box">
      <div class="dialog-header">
        <h3><i class="fa-solid fa-keyboard"></i> 快捷键</h3>
        <button id="closeShortcutsBtn" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="dialog-body" id="shortcutsBody">
      </div>
    </div>
  </div>

  <!-- P6-1: 命令面板 -->
  <div id="commandPalette" class="hidden">
    <div class="dialog-overlay"></div>
    <div class="palette-box">
      <div class="palette-input-wrap">
        <i class="fa-solid fa-terminal palette-icon"></i>
        <input type="text" id="paletteInput" placeholder="输入命令..." autocomplete="off">
      </div>
      <div id="paletteResults"></div>
      </div>
    </div>

    <!-- P7-1: 共享会话聊天面板 -->
    <div id="chatPanel" class="hidden">
      <div id="chatHeader">
        <h3><i class="fa-solid fa-comments"></i> 会话聊天</h3>
        <div>
          <span id="viewerCount" style="font-size:11px;color:var(--overlay);margin-right:8px;"></span>
          <button id="closeChatBtn" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <div id="chatMessages"></div>
      <div id="chatInputBar">
        <input type="text" id="chatInput" placeholder="输入消息...">
        <button id="sendChatBtn" class="btn-primary"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>

    <!-- 依赖库 -->
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-search@0.13.0/lib/xterm-addon-search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-unicode11@0.6.0/lib/xterm-addon-unicode11.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-ligatures@0.8.0/lib/xterm-addon-ligatures.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.0/dist/purify.min.js"></script>
  <!-- 应用逻辑 -->
</body>
</html>
